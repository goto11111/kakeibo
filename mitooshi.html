<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="見通し家計簿">
<meta name="theme-color" content="#2f6b45">
<title>🔭 見通し家計簿</title>
<style>
:root{
  --bg:#f5f2e9;--card:#fffdf8;--card2:#f0ece0;--text:#1f2a22;--text2:#6b746d;--line:#e4dfd1;
  --pri:#2f6b45;--pri2:#e2eee5;--onpri:#ffffff;
  --out:#c8463c;--in:#2e8b57;--warn:#c07a12;--sat:#2f6fb5;--sun:#c8463c;--sel:#fff1bf;--today:#2f6b45;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121613;--card:#1b211d;--card2:#232b25;--text:#e7ece8;--text2:#9aa59d;--line:#2d3730;
  --pri:#5fae7c;--pri2:#22362a;--onpri:#0e1a12;
  --out:#ef7d72;--in:#6fcf97;--warn:#f0b04a;--sat:#6fa8ee;--sun:#ef7d72;--sel:#3b3620;--today:#5fae7c;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:14px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
#app{max-width:560px;margin:0 auto}
header{position:sticky;top:0;z-index:20;background:var(--pri);color:var(--onpri);padding:calc(8px + env(safe-area-inset-top)) 10px 8px;display:flex;align-items:center;gap:6px}
header .ttl{font-weight:800;font-size:13px;opacity:.9;white-space:nowrap}
header .nav{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;min-width:0}
header .nav b{font-size:16px;white-space:nowrap}
header .nav small{display:block;font-size:10px;opacity:.8;text-align:center;font-weight:400}
.hbtn{background:rgba(255,255,255,.16);border:0;border-radius:8px;padding:6px 9px;color:inherit;font-size:13px;white-space:nowrap}
.arrow{background:none;border:0;color:inherit;font-size:20px;padding:2px 8px}
main{padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:13px;color:var(--text2);font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.sp{flex:1}
.muted{color:var(--text2);font-size:12px}
.big{font-size:26px;font-weight:800;letter-spacing:.5px}
.mid{font-size:18px;font-weight:800}
.out{color:var(--out)}.in{color:var(--in)}.warn{color:var(--warn)}
.bar{height:7px;background:var(--card2);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:5px}
.bar.over>i{background:var(--out)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .card{margin:0}
.tap{cursor:pointer}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--pri2);color:var(--pri);font-weight:700}
.pill.w{background:#fbe7d0;color:#9a5a00}
@media (prefers-color-scheme:dark){.pill.w{background:#3b2c14;color:#f0b04a}}
.pill.r{background:#f9dcd8;color:#a3291f}
@media (prefers-color-scheme:dark){.pill.r{background:#3d1f1c;color:#ef7d72}}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal .h{text-align:center;font-size:11px;color:var(--text2);padding:2px 0}
.cal .h.s0{color:var(--sun)}.cal .h.s6{color:var(--sat)}
.day{min-height:62px;border-radius:9px;padding:3px 3px 2px;background:var(--card);border:1px solid transparent;cursor:pointer;overflow:hidden;display:flex;flex-direction:column}
.day.dim{opacity:.38}
.day.sel{background:var(--sel);border-color:var(--warn)}
.day .n{font-size:12px;font-weight:700}
.day.today .n{background:var(--today);color:var(--onpri);border-radius:99px;display:inline-block;min-width:20px;text-align:center}
.day.hol .n,.day.w0 .n{color:var(--sun)}.day.w6 .n{color:var(--sat)}
.day.today.hol .n,.day.today.w0 .n,.day.today.w6 .n{color:var(--onpri)}
.day .v{font-size:9.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.day .cw{font-size:9px;line-height:1.2;margin-top:auto;border-radius:4px;padding:0 2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* list */
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;background:var(--card2)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t small{display:block;font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .a{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.li .a small{display:block;font-weight:400;font-size:10.5px;color:var(--text2)}
.addbtn{width:100%;border:1.5px dashed var(--pri);background:var(--pri2);color:var(--pri);border-radius:12px;padding:11px;font-weight:800;margin-top:6px}
.btn{border:0;border-radius:12px;padding:12px;font-weight:800;background:var(--pri);color:var(--onpri);width:100%}
.btn.sub{background:var(--card2);color:var(--text)}
.btn.del{background:none;color:var(--out);border:1px solid var(--out)}
.btn.sm{width:auto;padding:7px 12px;font-size:12px;border-radius:9px}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 4px;font-size:12.5px;font-weight:700;color:var(--text2)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* card withdraw */
.wd{border-radius:14px;border:1px solid var(--line);margin-bottom:10px;overflow:hidden;background:var(--card)}
.wd .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.wd .cdot{width:10px;height:34px;border-radius:4px;flex:none}
.wd .bd{padding:0 14px 8px;border-top:1px solid var(--line)}
.fl{display:flex;align-items:center;gap:10px;padding:8px 2px;border-top:1px solid var(--line)}
.fl .ic{width:26px;text-align:center;flex:none;font-size:16px}.fl .ic .cdot{display:inline-block;width:8px;height:22px;border-radius:3px;vertical-align:middle}
.fl .t{flex:1;min-width:0}.fl .t b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .t small{display:block;font-size:11px;color:var(--text2)}
.fl .bal{text-align:right;white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums}.fl .bal small{display:block;font-weight:400;font-size:11px;color:var(--text2)}
.fl.edge{background:var(--card2);border-radius:10px;border-top:0;margin:4px 0;padding:9px 8px}
.fl.past{opacity:.75}
.cf .fl{padding:3px 2px;gap:0 6px}.cf .fl.edge,.cf .fl.now{padding:4px 8px;margin:2px 0}.cf .fl .ic{width:20px;font-size:13px}.cf .fl .t b{font-size:12.5px}.cf .fl .t b small{display:inline;font-weight:400;color:var(--text2);margin-left:4px;font-size:10.5px}.cf .fl .bal{font-size:12.5px}
.accchips{flex-basis:100%;display:flex;flex-wrap:wrap;gap:3px;padding-left:26px}.cf .fl.edge .accchips,.cf .fl.now .accchips{flex-basis:auto;padding-left:0;margin-left:auto;justify-content:flex-end}.cf .fl.edge .t,.cf .fl.now .t{flex:none}.accchips span{font-size:10px;line-height:1.5;padding:0 6px;border-radius:99px;font-variant-numeric:tabular-nums;white-space:nowrap}.accchips .ac{background:var(--card2);color:var(--text2);font-weight:600}
.flbd{padding:0 4px 4px 36px;background:var(--card2);border-radius:0 0 10px 10px}
.cyc{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}.cyc .cyh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cyc .cdot{display:inline-block;width:8px;height:18px;border-radius:3px}.cyc .fl{border-top:0;padding:6px 8px}.cyc .fl .t b{white-space:normal}.wdd{font-weight:800;color:var(--text)}
.fl.now{background:var(--pri2);border-radius:10px;border-top:0;margin:4px 0;padding:7px 8px;color:var(--pri)}
.wd .chk{font-size:12px;padding:8px 14px;background:var(--card2)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs div{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:10.5px;color:var(--text2);font-weight:700}
nav.tabs button span{display:block;font-size:19px;line-height:1.2}
nav.tabs button.on{color:var(--pri)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(82px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;border:0;background:var(--pri);color:var(--onpri);font-size:30px;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:15}
/* sheet */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:none;justify-content:center}
#sheet>div{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom))}
.shd{display:flex;align-items:center;margin-bottom:10px}
.shd b{flex:1;font-size:15px}
.x{border:0;background:var(--card2);border-radius:99px;width:30px;height:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 11px;font-size:12.5px;font-weight:700}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--onpri)}
.amtd{display:flex;align-items:baseline;gap:4px;margin-top:8px}.amtd input{font-size:30px;font-weight:800;text-align:right;padding:6px 10px;font-variant-numeric:tabular-nums;color:inherit}.amtd small{font-size:16px;font-weight:800}
.fld{margin:8px 0}
.fld label{display:block;font-size:11.5px;color:var(--text2);margin-bottom:3px;font-weight:700}
.prev{font-size:12px;background:var(--pri2);color:var(--pri);border-radius:10px;padding:7px 10px;margin:6px 0;font-weight:700}
.note{font-size:11.5px;color:var(--text2);margin:4px 0 0}
body.hide .amt{filter:blur(7px)}
.tl-d{font-size:12px;font-weight:800;color:var(--text2);padding:10px 2px 2px;display:flex}
.tl-d span{margin-left:auto;font-variant-numeric:tabular-nums}
.banner{background:#fff4d6;border:1px solid #f0d58a;color:#6b4b00;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-size:12.5px}
@media (prefers-color-scheme:dark){.banner{background:#2f2914;border-color:#5a4a1c;color:#f0d58a}}
.legend .li{padding:7px 2px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:.92}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="ttl">🔭 見通し</div>
  <div class="nav">
    <button class="arrow" onclick="navMove(-1)">‹</button>
    <div><b id="navLabel"></b><small id="navSub"></small></div>
    <button class="arrow" onclick="navMove(1)">›</button>
  </div>
  <button class="hbtn" onclick="toggleHide()" id="hideBtn" title="金額を隠す">👁</button>
  <button class="hbtn" onclick="goToday()">今日</button>
</header>
<main id="main"></main>
</div>
<button class="fab" id="fab" onclick="openInput({})">＋</button>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="ov" onclick="closeSheet()"></div>
<div id="sheet"><div id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="application/json,.json" style="display:none" onchange="importJSON(this)">

<script>
'use strict';
const APP_VERSION='v1.12.2';
const KEY='mitooshi_v1';

// ── 基本ヘルパー ──
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const lastDay=(y,m0)=>new Date(y,m0+1,0).getDate();
const WD='日月火水木金土';
const fmt=n=>Math.round(n).toLocaleString('ja-JP');
// カレンダーのマス用の短い表記（1万以上は「万」）
const fmtS=n=>n>=10000?(Math.round(n/1000)/10)+'万':fmt(n);
const Y=n=>`<span class="amt">${n<0?'−':''}${fmt(Math.abs(n))}円</span>`;
const md=s=>{const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const todayStr=()=>ds(new Date());
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const PALETTE=['#e0564b','#3d8bd9','#e6a019','#8a63d2','#2fa37a','#d6578f','#4fb3c9','#8c7a5b','#6d8f2f','#c46a2b','#5b6bd6','#9a9a9a'];

// ── 祝日（内閣府の規則を計算で再現。春分・秋分は近似式）──
const HC={};
function holidays(y){
  if(HC[y])return HC[y];
  const s=new Set();const add=(m,d)=>s.add(`${y}-${pad(m)}-${pad(d)}`);
  const nthMon=(m,n)=>{const f=new Date(y,m-1,1).getDay();return 1+((8-f)%7)+(n-1)*7;};
  const k=Math.floor((y-1980)/4);
  add(1,1);add(1,nthMon(1,2));add(2,11);add(2,23);
  add(3,Math.floor(20.8431+0.242194*(y-1980)-k));
  add(4,29);add(5,3);add(5,4);add(5,5);add(7,nthMon(7,3));add(8,11);add(9,nthMon(9,3));
  add(9,Math.floor(23.2488+0.242194*(y-1980)-k));
  add(10,nthMon(10,2));add(11,3);add(11,23);
  // 振替休日：日曜の祝日 → 次の祝日でない日
  [...s].sort().forEach(h=>{const d=pd(h);if(d.getDay()===0){let n=addDays(d,1);while(s.has(ds(n)))n=addDays(n,1);s.add(ds(n));}});
  // 国民の休日：祝日に挟まれた平日
  [...s].sort().forEach(h=>{const a=addDays(pd(h),1),b=addDays(pd(h),2);if(!s.has(ds(a))&&s.has(ds(b))&&a.getDay()!==0)s.add(ds(a));});
  return HC[y]=s;
}
const isHol=d=>holidays(d.getFullYear()).has(ds(d));
const isOff=d=>d.getDay()===0||d.getDay()===6||isHol(d);
// mode: next=翌営業日 / prev=前営業日 / none=そのまま
function adjust(d,mode){
  if(mode!=='next'&&mode!=='prev')return d;
  const st=mode==='next'?1:-1;let g=0;
  while(isOff(d)&&g++<15)d=addDays(d,st);
  return d;
}

// ── データ ──
let S;
function defaultCats(){return [
  {id:'food',icon:'🍚',name:'食費',kind:'out'},{id:'daily',icon:'🧴',name:'日用品',kind:'out'},
  {id:'traffic',icon:'🚃',name:'交通費',kind:'out'},{id:'car',icon:'🚗',name:'車・ガソリン',kind:'out'},
  {id:'social',icon:'🍺',name:'交際費',kind:'out'},{id:'hobby',icon:'🎮',name:'趣味・娯楽',kind:'out'},
  {id:'cloth',icon:'👕',name:'衣服・美容',kind:'out'},{id:'medical',icon:'💊',name:'医療',kind:'out'},
  {id:'tel',icon:'📱',name:'通信・サブスク',kind:'out'},{id:'house',icon:'🏠',name:'住居・光熱',kind:'out'},
  {id:'tobacco',icon:'🚬',name:'たばこ',kind:'out'},{id:'repay',icon:'💸',name:'返済',kind:'out'},
  {id:'saving',icon:'🐷',name:'積立',kind:'out'},{id:'other',icon:'📦',name:'その他',kind:'out'},
  {id:'salary',icon:'💴',name:'給料',kind:'in'},{id:'bonus',icon:'🎁',name:'臨時収入',kind:'in'},
  {id:'refund',icon:'↩️',name:'返金',kind:'in'},{id:'otherin',icon:'📥',name:'その他収入',kind:'in'}
];}
// 既存「家計管理」(kakeibo.html) の決済サイクル設定を読み取り専用で参照（書き換えはしない）
function legacyCardCycles(){
  const def={'PayPayカード':{close:'end',offset:1,payDay:27},'リクルートカード':{close:15,offset:1,payDay:10},
    '三井住友カード':{close:'end',offset:1,payDay:26},'オリコカード':{close:'end',offset:1,payDay:27}};
  let s={};try{s=JSON.parse(localStorage.getItem('kakeibo_settings')||'{}')||{};}catch(e){}
  const m=Object.assign({},def,s.cardCycles||{});
  return Object.keys(m).filter(k=>m[k]&&!['現金','口座振替','PayPayチャージ','その他'].includes(k)).map(k=>({name:k,c:m[k]}));
}
function cardFromLegacy(x,i,accId){
  return {id:uid(),name:x.name,close:x.c.close==='end'?'end':Number(x.c.close)||'end',payMonth:Number(x.c.offset)||1,
    payDay:Number(x.c.payDay)||27,holiday:'next',accountId:accId,apr:15,freeCount:2,color:PALETTE[i%PALETTE.length]};
}
function freshData(){
  const t=todayStr();
  const accs=[{id:'bank',name:'メイン口座',type:'bank',opening:0,openingDate:t},{id:'wallet',name:'財布',type:'wallet',opening:0,openingDate:t}];
  return {v:1,
    settings:{startDay:15,shift:'prev',nameBy:'start',basis:'use'},
    accounts:accs,
    cards:legacyCardCycles().map((x,i)=>cardFromLegacy(x,i,'bank')),
    cats:defaultCats(),
    budgets:{plans:[],only:{}},
    tx:[],recurring:[],goals:[],startBills:[],start:null,
    ai:{usd:{spent:0,uses:[],deposits:[]},form:{basis:'free',loc:'',mood:'',free:''}},
    ui:{lastMethod:null,lastCat:'food',hide:false,setupDone:false}};
}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.v===1){S=Object.assign(freshData(),d);S.ui=Object.assign({},freshData().ui,d.ui||{});migrateData();return;}}}catch(e){}
  S=freshData();save();
}
// 取り込んだ「各月の固定費・給料のコピー」のうちスタート日（なければ今期のはじめ）以降の分を消し、
// 固定費・定期収入の設定から出すようにまとめる（設定を編集すれば今月分にも反映される）
function unifyLegacyFixed(){
  const st=S.start||periodRange(periodKeyOf(todayStr()))[0];
  const byName={};S.recurring.forEach(r=>{(byName[r.name]||(byName[r.name]=[])).push(r);});
  const hit=new Set();
  S.tx=S.tx.filter(t=>{
    if(t.src!=='legacy'||t.date<st)return true;
    if(t.cat==='saving'&&t.memo==='積立')return false; // v0.2の取り込みで出来た名前不明の積立
    const n=String(t.memo||'').replace(/（見込み）$/,'');
    if(byName[n]&&byName[n].some(r=>r.type===t.type)){hit.add(n);return false;}
    return true;
  });
  hit.forEach(n=>byName[n].forEach(r=>{if(r.start>st)r.start=st;}));
}
function migrateData(){
  if(!S.ui.planNoDay1){S.ui.planNoDay1=true;const clr=b=>(b&&b.items||[]).forEach(i=>i.day='');(S.budgets.plans||[]).forEach(clr);Object.values(S.budgets.only||{}).forEach(clr);}

// ── 月のはじまり（給料日はじまり対応）──
function pStart(y,m0){
  const st=S.settings.startDay;const L=lastDay(y,m0);
  const d=st==='end'?L:Math.min(Number(st)||1,L);
  return adjust(new Date(y,m0,d),S.settings.shift);
}
// key = 'YYYY-MM'（呼び方の月）→ [開始, 終了]
function periodRange(key){
  let [y,m]=key.split('-').map(Number);m-=1;
  if(S.settings.nameBy==='end')m-=1;
  return [ds(pStart(y,m)),ds(addDays(pStart(y,m+1),-1))];
}
function periodKeyOf(s){
  const d=pd(s);let y=d.getFullYear(),m=d.getMonth();
  if(d<pStart(y,m))m--;else if(d>=pStart(y,m+1))m++;
  const n=new Date(y,m+(S.settings.nameBy==='end'?1:0),1);
  return `${n.getFullYear()}-${pad(n.getMonth()+1)}`;
}
const keyAdd=(k,n)=>{const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const keyLabel=k=>{const [y,m]=k.split('-').map(Number);return `${y}年${m}月`;};
const rangeLabel=k=>{const [s,e]=periodRange(k);const a=pd(s),b=pd(e);return `${a.getMonth()+1}/${a.getDate()}〜${b.getMonth()+1}/${b.getDate()}`;};

// ── カード：締め日 → 引き落とし日 ──
function wdDate(card,purchase,k){
  let y=purchase.getFullYear(),m=purchase.getMonth();
  const close=card.close==='end'?lastDay(y,m):Math.min(Number(card.close),lastDay(y,m));
  if(purchase.getDate()>close)m++;
  m+=(Number(card.payMonth)||1)+(k||0);
  const yy=y+Math.floor(m/12),m0=((m%12)+12)%12;
  const day=card.payDay==='end'?lastDay(yy,m0):Math.min(Number(card.payDay)||27,lastDay(yy,m0));
  return adjust(new Date(yy,m0,day),card.holiday||'next');
}
// 分割手数料（概算）：元金 × 実質年率 × (回数+1) / 24
function feeOf(card,amount,n){
  if(n<=1||n<=(Number(card.freeCount)||0))return 0;
  const apr=Number(card.apr);return Math.round(amount*(isNaN(apr)?15:apr)/100*(n+1)/24);
}
function portions(e,card){
  const n=Math.max(1,Number(e.count)||1);const fee=feeOf(card,e.amount,n);
  const b=Math.floor(e.amount/n),r=e.amount-b*n,fb=Math.floor(fee/n),fr=fee-fb*n;const res=[];
  for(let k=0;k<n;k++)res.push({date:ds(wdDate(card,pd(e.date),k)),principal:b+(k===0?r:0),fee:fb+(k===0?fr:0),k,n,e,card});
  return res;
}

// ── 固定費・定期収入の展開 ──
function recDates(r,from,to){
  const s=r.start>from?r.start:from;const e=(r.end&&r.end<to)?r.end:to;
  if(!r.start||s>e)return [];
  const res=[];
  if(r.every==='month'||r.every==='year'||r.every==='nmonth'){
    const st0=pd(r.start),stIdx=st0.getFullYear()*12+st0.getMonth(),mInt=Math.max(1,Number(r.mInt)||2);
    let d=pd(s);let y=d.getFullYear(),m=d.getMonth();const ed=pd(e);
    // 調整で前月にずれる分を拾うため1か月前から
    m--;
    for(let g=0;g<400;g++){
      const yy=y+Math.floor(m/12),m0=((m%12)+12)%12;
      if(new Date(yy,m0,1)>addDays(ed,31))break;
      if(r.every==='year'&&m0+1!==Number(r.month)){m++;continue;}
      // ◯か月ごと：「いつから」の月を基準に、mInt か月おきの月だけ
      if(r.every==='nmonth'&&(((yy*12+m0-stIdx)%mInt)+mInt)%mInt!==0){m++;continue;}
      const L=lastDay(yy,m0);const day=r.day==='end'?L:Math.min(Number(r.day)||1,L);
      const raw=ds(new Date(yy,m0,day)),x=ds(adjust(new Date(yy,m0,day),r.adjust||'none'));
      // いつから・いつまでは土日祝でずらす前の日で判定（ずらして前に出た初回・後ろに出た最終回が消えないように）
      if(x>=from&&x<=to&&raw>=r.start&&(!r.end||raw<=r.end))res.push(x);
      m++;
    }
  }else{
    const step=r.every==='week'?7:r.every==='2week'?14:Math.max(1,Number(r.n)||10);
    const a=pd(r.start);const diff=Math.round((pd(s)-a)/864e5);
    let k=Math.max(0,Math.ceil(diff/step));
    for(let g=0;g<2000;g++){const x=ds(addDays(a,k*step));if(x>e)break;if(x>=s)res.push(x);k++;}
  }
  return res;
}
// 記録＋固定費の発生分（from〜to、購入日ベース）
function entries(from,to){
  const out=S.tx.filter(t=>t.date>=from&&t.date<=to).map(t=>Object.assign({},t));
  const t=todayStr();
  S.recurring.forEach(r=>{const est=r.vary?recEst(r):r.amount;const win=recWin(r);
    // 日付が決まっていない固定費は、実際に払った日が前後にずれるので広めに拾ってから払った日で絞る
    const qf=win?ds(addDays(pd(from),-62)):from,qt=win?ds(addDays(pd(to),62)):to;
    recDates(r,qf,qt).forEach(d=>{
    const ex=(r.ex||{})[d];if(ex&&ex.skip)return;const has=ex&&ex.amount!=null;
    const paid=win&&ex&&ex.date?ex.date:null;const date=paid||d;if(date<from||date>to)return;
    const we=win?winEnd(r,d):null;const due=win?(paid||we):d; // 金額を入れる目安の日
    const noDate=win&&!paid&&we<t,noAmt=!!r.vary&&!has&&due<=t;
    out.push({id:'r:'+r.id+':'+d,rid:r.id,rec:true,date,key:d,type:r.type,amount:has?ex.amount:est,
      cat:r.cat,method:r.method,count:1,memo:r.name,est:!!r.vary&&!has,missing:noDate||noAmt,noDate,noAmt,
      win:win&&!paid?{s:d,e:we}:null,paid:!!paid});
  });});
  (S.goals||[]).forEach(g=>goalPays(g,to).forEach(p=>{
    if(p.skip||p.amount<=0||p.date<from)return;const m=goalMethod(g);const fa=accOf(m);const mv=g.kind==='save'&&fa&&g.toAcc;
    out.push({id:'g:'+g.id+':'+p.date,gid:g.id,goal:true,date:p.date,type:mv?'move':'out',amount:p.amount,cat:g.kind==='debt'?'repay':'saving',
      method:m,from:fa?fa.id:null,to:g.toAcc,count:1,memo:'🎯 '+g.name,k:p.k,after:p.after});
  }));
  return out.sort((a,b)=>cmp(a.date,b.date));
}
// 金額が変わる固定費（ガス・電気など）：まだ金額を入れていない回は、直近3回の実際の金額（平均か最大）で見込む。
// 実際の金額がまだ1回もなければ、設定の金額を見込みにする
function recActuals(r){return Object.keys(r.ex||{}).filter(d=>r.ex[d]&&!r.ex[d].skip&&r.ex[d].amount!=null).sort().map(d=>({date:d,amount:Number(r.ex[d].amount)||0}));}
function recEst(r){
  const a=recActuals(r).slice(-3).map(x=>x.amount);if(!a.length)return Number(r.amount)||0;
  return r.est==='max'?Math.max(...a):Math.round(a.reduce((s,v)=>s+v,0)/a.length);
}
const estLabel=r=>r.est==='max'?'直近3回の最大':'直近3回の平均';
// 支払い日が決まっていない固定費（毎月・◯か月ごと）：「day〜dayToのどこか」。見通しでは一番早い日（day）に出ていく扱い
const recWin=r=>!!(r.win&&(r.every==='month'||r.every==='nmonth')&&r.dayTo!=null&&r.dayTo!=='');
function winEnd(r,d){
  const b=pd(d);let y=b.getFullYear(),m=b.getMonth();
  const st=r.day==='end'?99:Number(r.day)||1,en=r.dayTo==='end'?99:Number(r.dayTo)||1;
  if(en<st){m++;if(m>11){m=0;y++;}} // 20日〜5日 のように月をまたぐ
  const L=lastDay(y,m);return ds(new Date(y,m,en>=99?L:Math.min(en,L)));
}
const winLabel=r=>`${r.day==='end'?'末日':r.day+'日'}〜${r.dayTo==='end'?'末日':(r.dayTo<(r.day==='end'?99:r.day)?'翌月':'')+r.dayTo+'日'}のどこか`;
// 日付が過ぎたのに金額（または払った日）を入れていない回（スタート日か90日前のどちらか遅いほうから今日まで）
function missingRecs(){
  const t=todayStr();const back=ds(addDays(pd(t),-90));const from=S.start&&S.start>back?S.start:back;
  return entries(from,t).filter(x=>x.missing);
}
const missLabel=x=>x.noDate&&x.noAmt?'払った日・金額が未入力':x.noDate?'払った日が未入力':'金額が未入力';
// ── 🎯 目標（返済・積立）：毎月の支払いを残りがなくなるまで並べる ──
function goalMethod(g){return g.method||(g.fromAcc?'a:'+g.fromAcc:'a:'+((S.accounts.find(a=>a.type==='bank')||S.accounts[0]||{}).id));}
function goalPays(g,upto){
  const res=[];const total=Number(g.total)||0;let done=Number(g.done)||0;
  if(!g.start||done>=total)return res;
  const ex=g.ex||{};const mo=Number(g.monthly)||0;const map={};
  if(mo>0||Object.keys(ex).length)recDates({every:'month',day:g.day||S.settings.startDay||15,adjust:g.adjust||'none',start:g.start,end:''},g.start,upto).forEach(d=>map[d]={reg:true});
  // 臨時の支払い（ボーナス払いなど）
  (g.extra||[]).forEach(x=>{if(x.date&&x.date>=g.start&&x.date<=upto){const m=map[x.date]||(map[x.date]={});m.extra=(m.extra||0)+(Number(x.amount)||0);}});
  let k=0;
  for(const d of Object.keys(map).sort()){
    if(done>=total)break;const m=map[d],e=ex[d];let a=0,skip=false;
    if(m.reg){if(e&&e.skip)skip=true;else a+=(e&&e.amount!=null)?Number(e.amount)||0:mo;}
    a+=m.extra||0;
    if(a<=0){if(skip){k++;res.push({date:d,amount:0,skip:true,k,after:total-done});}continue;}
    a=Math.min(a,total-done);done+=a;k++;res.push({date:d,amount:a,k,after:total-done,extra:!!m.extra});
  }
  return res;
}
function goalStatus(g){
  const t=todayStr();const all=goalPays(g,'2099-12-31');const total=Number(g.total)||0;
  const paid=all.filter(p=>p.date<=t).reduce((s,p)=>s+p.amount,0);const progress=Math.min(total,(Number(g.done)||0)+paid);
  const future=all.filter(p=>p.date>t&&p.amount>0);const last=all.filter(p=>p.amount>0).slice(-1)[0];
  return {total,progress,remain:total-progress,future,next:future[0],finish:(last&&last.after<=0)?last.date:null,all,count:all.filter(p=>p.amount>0).length};
}
// ── 🐷 貯金分：積立の目標で「口座に貯める」を選んだ分は、その口座の中の貯金として使えるお金と分ける ──
// 貯金 ＝ 開始時点ですでに貯まっていた額 ＋ その日までの積立（総額まで） − 「貯金から使う」で記録した支出
// 「使えるお金に戻す」をした日からは貯金分ではなくなる
function savingPots(){return (S.goals||[]).filter(g=>g.kind==='save'&&g.toAcc&&accById(g.toAcc)&&accOf(goalMethod(g))).map(g=>({g,acc:g.toAcc,done:Number(g.done)||0,total:Number(g.total)||0,release:g.release||null,
  pays:goalPays(g,'2099-12-31').filter(p=>p.amount>0),uses:S.tx.filter(t=>t.pot===g.id&&t.type==='out')}));}
const potById=id=>savingPots().find(p=>p.g.id===id);
function potSaved(p,date){return Math.min(p.total,p.done+p.pays.reduce((t,x)=>t+(x.date<=date?x.amount:0),0));}
function potUsed(p,date){return p.uses.reduce((t,x)=>t+(x.date<=date?Number(x.amount)||0:0),0);}
function potBal(p,date){
  const a=accById(p.acc);if(!a||date<a.openingDate||(p.release&&date>=p.release))return 0;
  return Math.max(0,potSaved(p,date)-potUsed(p,date));
}
function savedIn(pots,date,accId){return pots.reduce((s,p)=>accId&&p.acc!==accId?s:s+potBal(p,date),0);}
// 引き落とし日が from〜to に入るカード払いの各回
function charges(from,to){
  const f=pd(from);const pf=ds(new Date(f.getFullYear(),f.getMonth()-30,1));
  const res=[];
  entries(pf,to).forEach(e=>{if(e.type!=='out')return;const c=cardOf(e.method);if(!c)return;
    portions(e,c).forEach(p=>{if(p.date>=from&&p.date<=to)res.push(p);});});
  // 仕切り直し：スタート前に使った分の請求（手入力）
  (S.startBills||[]).forEach(b=>{const c=cardById(b.cardId);if(!c||!(Number(b.amount)>0)||b.date<from||b.date>to)return;
    res.push({date:b.date,principal:Number(b.amount),fee:0,k:0,n:1,card:c,e:{id:b.id,bill:true,date:S.start||b.date,type:'out',amount:Number(b.amount),cat:'other',memo:'スタート前の利用分（手入力）',method:'c:'+c.id}});});
  return res.sort((a,b)=>cmp(a.date,b.date));
}
function groupCharges(list){
  const g={};list.forEach(p=>{const k=p.card.id+'|'+p.date;(g[k]||(g[k]={card:p.card,date:p.date,total:0,fee:0,items:[]}));
    g[k].total+=p.principal+p.fee;g[k].fee+=p.fee;g[k].items.push(p);});
  return Object.values(g).sort((a,b)=>cmp(a.date,b.date)||cmp(a.card.name,b.card.name));
}

// ── 口座の出入り（残高の見通し）──
function buildLedger(to){
  if(!S.accounts.length)return [];
  const from=S.accounts.reduce((m,a)=>a.openingDate<m?a.openingDate:m,S.accounts[0].openingDate);
  if(from>to)return [];
  const ev=[];
  entries(from,to).forEach(e=>{
    if(e.type==='move'&&e.from===e.to){ev.push({date:e.date,acc:e.to,delta:0,kind:'save',e});return;}
    if(e.type==='move'){ev.push({date:e.date,acc:e.from,delta:-e.amount,kind:'move',e});ev.push({date:e.date,acc:e.to,delta:e.amount,kind:'move',e});return;}
    const a=accOf(e.method);if(!a)return;
    ev.push({date:e.date,acc:a.id,delta:e.type==='in'?e.amount:-e.amount,kind:e.type,e});
  });
  groupCharges(charges(from,to)).forEach(g=>ev.push({date:g.date,acc:cardAcc(g.card),delta:-g.total,kind:'card',g}));
  budgetReserves(from,to).forEach(r=>ev.push({date:r.date,acc:r.acc,delta:-r.amount,kind:'reserve',r}));
  return ev.filter(x=>{const a=accById(x.acc);return a&&x.date>=a.openingDate;})
    .sort((a,b)=>cmp(a.date,b.date)||(b.delta-a.delta));
}
function balAt(L,accId,date){
  const a=accById(accId);if(!a||date<a.openingDate)return 0;
  let b=Number(a.opening)||0;for(const x of L)if(x.acc===accId&&x.date<=date)b+=x.delta;return b;
}
function totalAt(L,date){return S.accounts.filter(a=>a.openingDate<=date).reduce((s,a)=>s+balAt(L,a.id,date),0);}

// ── 期間の収支（後払いの数え方を反映）──
function flows(key){const [s,e]=periodRange(key);return flowsRange(s,e);}
function flowsRange(s,e){
  let out=0,inn=0;const byCat={};const items=[];
  const addOut=(cat,v,it)=>{out+=v;byCat[cat]=(byCat[cat]||0)+v;items.push(it);};
  entries(s,e).forEach(x=>{
    if(x.type==='in'){inn+=x.amount;return;}
    if(x.type!=='out')return;
    if(S.settings.basis==='withdraw'&&cardOf(x.method))return;
    addOut(x.cat,x.amount,{date:x.date,cat:x.cat,amount:x.amount,e:x});
  });
  if(S.settings.basis==='withdraw')charges(s,e).forEach(p=>addOut(p.e.cat,p.principal+p.fee,{date:p.date,cat:p.e.cat,amount:p.principal+p.fee,e:p.e,p}));
  return {out,inn,byCat,items,s,e};
}
// 仕切り直し後：スタート時に入れたお金から、収入を足して使った分を引いていく
// （カードは使った日で引く。スタート前に使ったカードの請求は最初に引いておく）
function startPool(upto){
  if(!S.start||upto<S.start)return null;
  const base=S.accounts.filter(a=>a.openingDate<=upto).reduce((s,a)=>s+(Number(a.opening)||0),0);
  const bills=S.settings.basis==='withdraw'?0:(S.startBills||[]).reduce((s,b)=>s+(Number(b.amount)||0),0);
  const f=flowsRange(S.start,upto);
  const reserve=budgetReserves(S.start,upto).reduce((s,r)=>s+r.amount,0);
  return {base,bills,inn:f.inn,out:f.out,reserve,remain:base-bills+f.inn-f.out-reserve};
}
// 予算：手で記録した支出（固定費・目標は除く）と、予算の「大きいほう」を使う扱いにする
// 口座から実際にお金が出入りする日で数える（カードは引き落とし日）
// 期末に残る = スタート時（前期から）＋ 入るお金 − カードの引き落とし − 口座・現金から出るお金 − 目標 − 予算の残り
function cashPeriod(s,e){
  if(!S.start||e<S.start)return null;
  const from=s>S.start?s:S.start;const L=buildLedger(e);
  const prev=from===S.start?S.accounts.filter(a=>a.openingDate<=S.start).reduce((t,a)=>t+(Number(a.opening)||0),0):totalAt(L,ds(addDays(pd(from),-1)));
  const r={prev,inn:0,card:0,cards:{},direct:0,goal:0,reserve:0,from,e,list:[]};
  L.forEach(x=>{if(x.date<from||x.date>e)return;
    if(x.kind!=='move'&&x.kind!=='save'){const a=accById(x.acc);let ic,lb;
      if(x.kind==='card'){ic='💳';lb=x.g.card.name+' 引き落とし';}
      else if(x.kind==='reserve'){ic=x.r.label&&x.r.label!=='予定外の予算'?'📌':'📊';lb=reserveLabel(x.r);}
      else if(x.e&&x.e.goal){ic='🎯';lb=(goalById(x.e.gid)||{}).name||'目標';}
      else{const c=catById(x.e.cat);ic=x.kind==='in'?'💴':c.icon;lb=(x.e.memo||c.name)+(x.e.est?'（見込み）':'');}
      r.list.push({date:x.date,ic,lb,acc:a?a.name:'',v:x.delta,kind:x.kind});}
    if(x.kind==='in')r.inn+=x.delta;
    else if(x.kind==='card'){r.card-=x.delta;r.cards[x.g.card.name]=(r.cards[x.g.card.name]||0)-x.delta;}
    else if(x.kind==='reserve')r.reserve-=x.delta;
    else if(x.kind==='out'){if(x.e&&x.e.goal)r.goal-=x.delta;else r.direct-=x.delta;}
    // 振替（口座間の移動・積立口座への積立）は合計が変わらないので数えない
  });
  r.end=r.prev+r.inn-r.card-r.direct-r.goal-r.reserve;
  r.saved=savedIn(savingPots(),e);
  return r;
}
function budgetUse(s,e){
  const byCat={};let all=0;
  // 予算は手で記録した支出の枠。固定費（別に引いている）・目標・🐷貯金から使った分は予算の外
  // 項目から使った分は、その項目のカテゴリで数える
  entries(s,e).forEach(x=>{if(x.type!=='out'||x.goal||x.rec||(x.pot&&goalById(x.pot)))return;all+=x.amount;
    const it=planById(txPlan(x));const c=it&&it.cat?it.cat:x.cat;byCat[c]=(byCat[c]||0)+x.amount;});
  return {byCat,all};
}
// 見通し用：その期に口座から実際に出ていく分で数える（カードは引き落とし日、口座・現金は使った日）。
// たとえば 10/10 にカードで買った飲み物が 11/27 に引き落とされるなら、11/27 を含む期の飲み物の予算から引く
function budgetUseCash(key){
  const [s,e]=periodRange(key);const byCat={},byItem={};let all=0;
  const add=(x,v)=>{all+=v;const it=planIn(x,key);const c=it&&it.cat?it.cat:x.cat;byCat[c]=(byCat[c]||0)+v;if(it)byItem[it.id]=(byItem[it.id]||0)+v;};
  const skip=x=>x.type!=='out'||x.goal||x.rec||x.bill||(x.pot&&goalById(x.pot));
  entries(s,e).forEach(x=>{if(skip(x)||cardOf(x.method))return;add(x,x.amount);});
  charges(s,e).forEach(p=>{if(skip(p.e))return;add(p.e,p.principal+p.fee);});
  return {byCat,all,byItem};
}
// その記録が key の期の予算のどの項目にあたるか（選んだ項目と同じ項目か、メモに項目名が入っているか）
function planIn(t,key){
  if(!t||t.type!=='out'||t.goal||t.rec||t.pot)return null;
  const its=budgetOf(key).items||[];
  if(t.plan)return its.find(i=>i.id===t.plan.split('@')[0])||null;
  const m=t.memo||'';if(!m)return null;let best=null,bl=0;
  its.forEach(it=>{const n=(it.name||'').trim();if(n.length>=2&&n.length>bl&&m.includes(n)){best=it;bl=n.length;}});
  return best;
}
// 記録がどの予算の項目から使ったものか（'項目id@期'）。項目を選んで記録したものはそのまま。
// 選ばずに記録しても、メモに項目名が入っていればその期のその項目から使った扱いにする（例：「ドンキ_飲み物」→ 📌飲み物）
function txPlan(t){
  if(!t||t.type!=='out'||t.goal||t.rec||t.pot)return null;
  if(t.plan)return t.plan;
  const m=t.memo||'';if(!m)return null;
  const k=periodKeyOf(t.date);let best=null,bl=0;
  (budgetOf(k).items||[]).forEach(it=>{const n=(it.name||'').trim();if(n.length>=2&&n.length>bl&&m.includes(n)){best=it;bl=n.length;}});
  return best?best.id+'@'+k:null;
}
function planById(pk){if(!pk)return null;const [id,key]=pk.split('@');return (budgetOf(key).items||[]).find(i=>i.id===id)||null;}
// 予算の内訳（項目）：項目ごとに金額と払い方を決め、記録で選んだ分を「使った」として積み上げる
function planDate(it,key){
  if(it.day===''||it.day==null)return null; // 日付なし（いつでも）
  const [s,e]=periodRange(key);
  for(const base of [pd(s),pd(e)]){const y=base.getFullYear(),m=base.getMonth();const L=lastDay(y,m);
    const x=ds(new Date(y,m,it.day==='end'?L:Math.min(Number(it.day)||1,L)));if(x>=s&&x<=e)return x;}
  return s;
}
// 予算の項目（内訳）：記録で選んだ分を「使った」として積み上げ、残りを出す
const planUsed=(it,key)=>S.tx.filter(t=>txPlan(t)===it.id+'@'+key).reduce((a,t)=>a+(Number(t.amount)||0),0);
function planItems(key,cu){return (budgetOf(key).items||[]).map(it=>{const used=cu?cu.byItem[it.id]||0:planUsed(it,key),amt=Number(it.amount)||0,remain=Math.max(0,amt-used);
  return Object.assign({},it,{date:planDate(it,key),used,remain,done:remain<=0,key});});}
// cash：見通し用（その期に出ていく分で数える）。それ以外は使った日で数える
function budgetReserve(key,cash){
  const [s,e]=periodRange(key);const b=budgetOf(key);const cats=b.cats||{};const cu=cash?budgetUseCash(key):null;const items=planItems(key,cu);
  const catKeys=[...new Set([...Object.keys(cats).filter(k=>Number(cats[k])>0),...items.map(i=>i.cat)])];
  if(!(Number(b.total)>0)&&!catKeys.length)return {reserve:0,used:0,planned:0,s,e,has:false,cats:{},pending:[],rest:0};
  const u=cu||budgetUse(s,e);const det={};let pending=[],rest=0,catUsed=0,catPlanned=0;
  catKeys.forEach(k=>{
    const its=items.filter(i=>i.cat===k);const B=Math.max(Number(cats[k])||0,its.reduce((a,i)=>a+(Number(i.amount)||0),0));
    const U=u.byCat[k]||0;const itemUsed=its.reduce((a,i)=>a+i.used,0);
    // このカテゴリでまだ取っておく額は「予算 − 実際に使った額」まで（超えたら0）。
    // 項目に入れずに使った分は、まず項目にしていない分から減らし、足りなければ項目の残りから減らす
    // （日付なし → 日付の遅い項目から）。こうしないと、使った分と予算の枠を二重に引いてしまう
    const R=Math.max(0,B-U);
    const pend=its.filter(i=>i.remain>0).map(i=>Object.assign({},i,{plan:i.remain}));
    let over=pend.reduce((a,i)=>a+i.remain,0)-R;
    pend.slice().sort((a,b)=>(a.date?1:0)-(b.date?1:0)||cmp(b.date||'',a.date||'')).forEach(i=>{if(over<=0)return;const c=Math.min(i.remain,over);i.remain-=c;over-=c;});
    const live=pend.filter(i=>i.remain>0);const P=live.reduce((a,i)=>a+i.remain,0);
    const r=Math.max(0,R-P);det[k]={B,U,P,rest:r,items:its,cut:pend.filter(i=>i.remain<i.plan),other:Math.max(0,U-itemUsed)};pending=pending.concat(live);rest+=r;catUsed+=U;catPlanned+=U+P+r;
  });
  const totalRest=Math.max(0,(Number(b.total)||0)-(catPlanned+(u.all-catUsed)));
  const P=pending.reduce((a,i)=>a+i.remain,0);
  const reserve=P+rest+totalRest;
  const usedB=Number(b.total)>0?u.all:catUsed; // 予算の対象（総額があれば全部、なければ予算を決めたカテゴリだけ）
  return {reserve,used:usedB,planned:usedB+reserve,s,e,has:true,cats:det,pending,rest:rest+totalRest,totalRest,pendingSum:P};
}
// 予算の残りをどう払う予定か（カードなら締め日・引き落とし日どおりに落ちる日へ、口座・財布なら期末に）
function reserveMethod(){
  const m=S.settings.reserveMethod;if(m&&(cardOf(m)||accOf(m)))return m;
  const cnt={};S.tx.forEach(t=>{if(t.type==='out'&&cardOf(t.method))cnt[t.method]=(cnt[t.method]||0)+1;});
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];if(top)return top;
  if(S.cards[0])return 'c:'+S.cards[0].id;const a=S.accounts.find(a=>a.type==='bank')||S.accounts[0];return a?'a:'+a.id:null;
}
// スタート日を含む期（とそれより前）は実績だけで数え、予算は引かない
const reserveSkip=(s)=>S.start&&s<=S.start;
// 予算は「その期に口座から出ていくお金の枠」：引くのは「予算 − その期に実際に出ていく分（カードは引き落とし日で数える）」（超えたら0）
// 口座・財布払いは期のはじめ（今期なら今日）に、カード払いはその期の引き落とし日にまとめて引く。
// カードで今から使ってもこの期の引き落としに間に合わない（締めが過ぎた）なら、この期では引かない（次の期の予算で引く）
function reserveWd(c,s,e){
  let p=pd(todayStr()); // 今日から先に使う分が、この期（s〜e）の引き落としに入るか
  for(let g=0;g<8;g++){const w=ds(wdDate(c,p,0));if(w>e)return null;if(w>=s)return w;p=addDays(pd(cardCycle(c,ds(p))[1]),1);}
  return null;
}
function reservePlan(k){
  const t=todayStr();const [s,e]=periodRange(k);if(e<t||reserveSkip(s))return [];
  const r=budgetReserve(k,true);if(!(r.reserve>0))return [];
  const d0=s>t?s:t;const out=[];
  const lump=(m,amt,label,cat,used)=>{if(!(amt>0))return;const c=cardOf(m);
    if(c){const w=reserveWd(c,s,e);if(w)out.push({key:k,date:w,amount:amt,acc:cardAcc(c),via:c.name,card:true,cardId:c.id,label,cat,used});}
    else{const a=accOf(m);if(a)out.push({key:k,date:d0,amount:amt,acc:a.id,via:a.name,label,cat,used});}};
  r.pending.forEach(it=>lump(it.method||reserveMethod(),it.remain,it.name,it.cat,(Number(it.amount)||0)-it.remain));
  Object.keys(r.cats).forEach(c=>lump(reserveMethod(),r.cats[c].rest,catById(c).name+'（項目にしていない分）',c));
  lump(reserveMethod(),r.totalRest,'予算総額の残り',null);
  return out;
}
// 見通しの予算の行：どの期の予算か（カードだと前の期の分と次の期の分が同じ引き落とし日に並ぶことがある）
const reserveLabel=r=>`${r.label||'予算'}（${Number(r.key.split('-')[1])}月分の予算${r.used?`・この期に出ていく ${fmt(r.used)}円を引いた残り`:''}）`;
function budgetReserves(from,to){
  const t=todayStr();const res=[];if(to<t)return res;
  let k=periodKeyOf(t);
  for(let g=0;g<40;g++){const [s]=periodRange(k);if(s>to)break;
    reservePlan(k).forEach(x=>{if(x.date>=from&&x.date<=to&&x.amount>0)res.push(x);});
    k=keyAdd(k,1);}
  return res;
}
function budgetOf(key){
  const b=S.budgets;if(b.only[key])return b.only[key];
  const p=b.plans.filter(x=>x.from<=key).sort((a,c)=>cmp(c.from,a.from))[0];
  return p||{total:0,cats:{}};
}

// ── 見通しの要約（ホームの上に出す）──
function forecast(horizon){
  const t=todayStr();const L=buildLedger(horizon);
  const cur=S.accounts.filter(a=>a.openingDate<=t);
  const bal={};cur.forEach(a=>bal[a.id]=balAt(L,a.id,t));
  let total=cur.reduce((s,a)=>s+bal[a.id],0);
  const future=L.filter(x=>x.date>t&&x.date<=horizon);
  // 未来に開始する口座はその日に開始残高が入る扱い
  S.accounts.filter(a=>a.openingDate>t&&a.openingDate<=horizon).forEach(a=>future.push({date:a.openingDate,acc:a.id,delta:Number(a.opening)||0,kind:'open'}));
  future.sort((a,b)=>cmp(a.date,b.date)||(b.delta-a.delta));
  let run=total,min=total,minDate=t;const runAcc=Object.assign({},bal);const short={};
  const days=[];let curDay=null;
  future.forEach(x=>{
    run+=x.delta;runAcc[x.acc]=(runAcc[x.acc]||0)+x.delta;
    if(!curDay||curDay.date!==x.date){curDay={date:x.date,items:[],acc:{}};days.push(curDay);}
    curDay.items.push(x);curDay.total=run;curDay.acc[x.acc]=runAcc[x.acc];
    if(x.kind==='card'&&runAcc[x.acc]<0&&!short[x.acc+'|'+x.date])short[x.acc+'|'+x.date]={acc:x.acc,date:x.date,bal:runAcc[x.acc],g:x.g};
  });
  // 🐷 貯金分は「使えるお金」に入れない（いちばん少なくなる日も、貯金を除いた額で見る）
  const pots=savingPots();const saved=savedIn(pots,t);const accSaved={};S.accounts.forEach(a=>{const v=savedIn(pots,t,a.id);if(v)accSaved[a.id]=v;});
  min=total-saved;
  days.forEach(d=>{d.saved=savedIn(pots,d.date);d.use=d.total-d.saved;if(d.use<min){min=d.use;minDate=d.date;}});
  // 口座ごとの最低残高
  const accMin={};const ra=Object.assign({},bal);Object.keys(ra).forEach(k=>accMin[k]={v:ra[k],date:t});
  future.forEach(x=>{ra[x.acc]=(ra[x.acc]||0)+x.delta;if(!accMin[x.acc]||ra[x.acc]<accMin[x.acc].v)accMin[x.acc]={v:ra[x.acc],date:x.date};});
  const accSavedEnd={};S.accounts.forEach(a=>{const v=savedIn(pots,horizon,a.id);if(v)accSavedEnd[a.id]=v;});
  return {total,bal,min,minDate,days,short:Object.values(short),free:Math.min(total-saved,min),accEnd:ra,accMin,saved,use:total-saved,accSaved,accSavedEnd,savedEnd:savedIn(pots,horizon)};
}
function horizonEnd(h){const k=keyAdd(periodKeyOf(todayStr()),Number(h)||0);return periodRange(k)[1];}
function nextWithdraw(){
  const t=todayStr();const g=groupCharges(charges(t,ds(addDays(new Date(),75))));
  if(!g.length)return null;const d=g[0].date;const same=g.filter(x=>x.date===d);
  return {date:d,list:same,total:same.reduce((s,x)=>s+x.total,0)};
}

// 記録の種類ごとに開く画面

// ── 入力シート ──
let F=null;
function defaultMethod(type){
  const lm=S.ui.lastMethod;
  if(type==='in'){const b=S.accounts.find(a=>a.type==='bank')||S.accounts[0];return b?'a:'+b.id:null;}
  if(lm&&(cardOf(lm)||accOf(lm)))return lm;
  return S.cards[0]?'c:'+S.cards[0].id:(S.accounts[0]?'a:'+S.accounts[0].id:null);
}
function openInput(o){
  const isNew=!o.edit;
  if(o.edit){F=Object.assign({},o.edit,{amountStr:String(o.edit.amount)});}
  else{
    F={type:'out',date:o.date||sel||todayStr(),amountStr:'',cat:S.ui.lastCat||'food',method:defaultMethod('out'),count:1,memo:''};
    const w=S.accounts.find(a=>a.type==='wallet'),b=S.accounts.find(a=>a.type==='bank');
    F.from=(b||S.accounts[0]||{}).id;F.to=(w||S.accounts[1]||{}).id;
    if(o.plan){renderInput();pickPlan(o.plan);}
  }

  // 新しく記録するときは金額欄にカーソルを置いて、端末のキーボードを出す
  if(isNew){const a=document.getElementById('inAmt');if(a)a.focus();}
}
function editTx(id){const t=S.tx.find(x=>x.id===id);if(t)openInput({edit:t});}
function setF(k,v){
  F[k]=v;if(k==='cat'&&F.plan){const [id,key]=F.plan.split('@');const it=(budgetOf(key).items||[]).find(x=>x.id===id);if(!it||it.cat!==v)F.plan=null;}
  if(k==='type'){
    const kind=v==='in'?'in':'out';
    if(catById(F.cat).kind!==kind)F.cat=(S.cats.find(c=>c.kind===kind)||{}).id;
    if(v==='in'&&!accOf(F.method))F.method=defaultMethod('in');
    if(v==='out'&&!F.method)F.method=defaultMethod('out');
  }
  if(k==='method'&&!cardOf(v))F.count=1;
  renderInput();
}
// 金額欄（端末のキーボードで入力）。全角数字も受け付け、数字以外は捨てる

      <div class="chips">${methods.map(m=>`<button class="chip ${F.method===m?'on':''}" onclick="setF('method','${m}')">${esc(mName(m))}</button>`).join('')}</div>`;
    if(cardOf(F.method)&&F.type==='out'){

function pickPot(id){
  if(F.pot===id){F.pot=null;renderInput();return;}

function pickPlan(pk){
  if(F.plan===pk){F.plan=null;renderInput();return;}
  const [id,key]=pk.split('@');const it=(budgetOf(key).items||[]).find(x=>x.id===id);if(!it)return;
  F.plan=pk;F.pot=null;F.cat=it.cat;if(!F.memo)F.memo=it.name;
  if(it.method&&(cardOf(it.method)||accOf(it.method)))F.method=it.method;F.count=1;renderInput();

function saveTx(){
  const amount=Number(F.amountStr)||0;
  if(amount<=0){toast('金額を入力してください');return;}
  if(!F.date){toast('日付を入れてください');return;}
  const t={id:F.id||uid(),date:F.date,type:F.type,amount,memo:(F.memo||'').trim()};
  if(F.src)t.src=F.src;
  if(F.type==='move'){if(!F.from||!F.to||F.from===F.to){toast('別々の口座を選んでください');return;}t.from=F.from;t.to=F.to;}
  else{if(!F.method){toast('支払い方法を選んでください');return;}t.cat=F.cat;t.method=F.method;t.count=cardOf(F.method)&&F.type==='out'?Number(F.count)||1:1;
    if(F.type==='out'){S.ui.lastMethod=F.method;S.ui.lastCat=F.cat;if(F.plan)t.plan=F.plan;else if(F.pot)t.pot=F.pot;}}
  const i=S.tx.findIndex(x=>x.id===t.id);if(i>=0)S.tx[i]=t;else S.tx.push(t);
  save();closeSheet();sel=t.date;curKey=periodKeyOf(t.date);render();toast('保存しました');

function delTx(){if(!confirm('この記録を削除しますか？'))return;S.tx=S.tx.filter(x=>x.id!==F.id);save();closeSheet();render();}

function openRecOcc(rid,date){
  const r=S.recurring.find(x=>x.id===rid);if(!r)return;const ex=(r.ex||{})[date]||{};
  if(r.vary||recWin(r)){const est=r.vary?recEst(r):r.amount,has=ex.amount!=null,win=recWin(r);
    const amtF=r.vary?`<div class="fld"><label>この回の実際の金額</label><input type="text" inputmode="numeric" id="occAmt" value="${has?ex.amount:''}" placeholder="見込み ${fmt(est)}" onkeydown="if(event.key==='Enter')saveOcc('${rid}','${date}',false)"></div>`
      :`<div class="fld"><label>この回の金額</label><input type="number" inputmode="numeric" id="occAmt" value="${has?ex.amount:r.amount}"></div>`;
    const dateF=win?`<div class="fld"><label>実際に払った日（${md(date)}〜${md(winEnd(r,date))}のどこか）</label><input type="date" id="occDate" value="${ex.date||''}"></div>`:'';
    const notes=[];
    if(win)notes.push(ex.date?`${md(ex.date)}に払った扱いです。`:`まだ払っていないので、いちばん早い${md(date)}に出ていく扱いで計算しています。払ったら日付を入れると、その日に動きます。`);

function cardCycle(card,date){
  const d=pd(date);let y=d.getFullYear(),mo=d.getMonth();
  const cl=(yy,mm)=>{const Y0=yy+Math.floor(mm/12),M0=((mm%12)+12)%12;return new Date(Y0,M0,card.close==='end'?lastDay(Y0,M0):Math.min(Number(card.close)||lastDay(Y0,M0),lastDay(Y0,M0)));};
  let end=cl(y,mo);if(d>end)end=cl(y,mo+1);
  const prevEnd=cl(end.getFullYear(),end.getMonth()-1);
  return [ds(addDays(prevEnd,1)),ds(end)];
}
const cycleNote=c=>`${c.close==='end'?'月末':c.close+'日'}締め・${c.payMonth>1?c.payMonth+'か月後':'翌月'}${c.payDay==='end'?'末':c.payDay+'日'}払い`;
// 🧾 その期にカードで使った分：締め期間ごとに「◯〜◯に使った分 → ◯に引き落とし」を分けて出す
// 表示する期は引き落としタブの月に合わせて動く（今月を見ているときが今期）。今日を含む期なら、今日の締め期間に📍を付ける
function cardCycles(pk){
  if(!S.cards.length)return '';
  const t=todayStr();const [ps,pe]=periodRange(pk);const inNow=t>=ps&&t<=pe;
  let h=`<div class="card"><h3>🧾 この期のカード（使った日 → 引き落とし日）</h3>`;
  S.cards.forEach(c=>{
    const cyc=[];let s=ps;
    for(let g=0;g<6&&s<=pe;g++){const [a,b]=cardCycle(c,s);cyc.push([a,b]);s=ds(addDays(pd(b),1));}
    const rows=cyc.map(([a,b])=>{
      const lo=a<ps?ps:a,hi=b>pe?pe:b;const wd=ds(wdDate(c,pd(b),0));
      const used=entries(lo,hi).filter(x=>x.type==='out'&&x.method==='c:'+c.id);
      const v=used.reduce((s,x)=>s+portions(x,c).filter(p=>p.k===0).reduce((u,p)=>u+p.principal+p.fee,0),0);
      return {lo,hi,b,wd,v,n:used.length,now:inNow&&t>=lo&&t<=hi};
    });
    h+=`<div class="cyc"><div class="cyh"><span class="cdot" style="background:${cardColor(c)}"></span><b>${esc(c.name)}</b><span class="muted">${cycleNote(c)}</span></div>
      ${rows.map(r=>`<div class="fl"><div class="t"><b>${md(r.lo)}〜${md(r.hi)}に使った分${r.hi<r.b?`<span class="muted">（締めは${md(r.b)}）</span>`:''}</b>
        <small>→ <span class="wdd">${md(r.wd)}</span> に引き落とし${r.n?`・${r.n}件`:''}${r.now?` <span class="pill">📍 今日（${md(t)}）使うとここ</span>`:''}</small></div>
        <div class="bal"><span class="amt">${fmt(r.v)}</span>円</div></div>`).join('')}</div>`;
  });
  return h+`</div>`;
}

// ── 🔭 見通し ──
// 期ごとの残り：前期の残りを引き継いで、給料と引き落とし（確定分）を足し引きしていく
// 期ごとの残り：1本の計算で、期末をそのまま次の期の「前期から」に引き継ぐ
// 期末 = 前期から ＋ 給料など − 引き落とし（カード・口座振替・現金・目標） − 予算（この期に落ちる分。予算込みのとき）
function periodChain(n,withB){
  if(!S.start)return null;
  const rows=[];let k=periodKeyOf(S.start);const last=keyAdd(periodKeyOf(todayStr()),n-1);
  let bal=null;
  for(let g=0;g<36&&k<=last;g++){
    const [s,e]=periodRange(k);const c=cashPeriod(s,e);if(!c){k=keyAdd(k,1);continue;}
    if(bal===null)bal=c.prev;
    const prev=bal,out=c.card+c.direct+c.goal,res=withB?c.reserve:0;
    bal=prev+c.inn-out-res;
    // 口座ごとの期末残高（予算を引かないときは予算の分を戻す）
    const L=buildLedger(e);const accEnd={};
    S.accounts.filter(a=>a.openingDate<=e).forEach(a=>{let v=balAt(L,a.id,e);if(!withB)L.forEach(x=>{if(x.kind==='reserve'&&x.acc===a.id&&x.date<=e)v-=x.delta;});accEnd[a.id]=v;});
    const pots=savingPots();const accSaved={};S.accounts.forEach(a=>{const v=savedIn(pots,e,a.id);if(v)accSaved[a.id]=v;});
    rows.push({k,s,e,c,prev,out,res,end:bal,accEnd,accSaved,past:e<todayStr(),now:s<=todayStr()&&todayStr()<=e});
    k=keyAdd(k,1);
  }
  return rows;
}

function donut(parts,total,center){

  return `<svg viewBox="0 0 160 160" width="180" height="180" style="display:block;margin:0 auto"><g transform="rotate(-90 80 80)">
    <circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--card2)" stroke-width="24"/>${segs}</g>
    <text x="80" y="74" text-anchor="middle" font-size="10" fill="var(--text2)">${center}</text>
    <text x="80" y="94" text-anchor="middle" font-size="16" font-weight="800" fill="var(--text)" class="amt">${fmt(total)}円</text></svg>`;
}

  return h;
}

const dayOpts=(v,withEnd)=>[...Array(31)].map((_,i)=>`<option value="${i+1}" ${String(v)===String(i+1)?'selected':''}>${i+1}日</option>`).join('')+(withEnd?`<option value="end" ${v==='end'?'selected':''}>末日</option>`:'');

function cardRule(c){return `${c.close==='end'?'末日':c.close+'日'}締め・${c.payMonth==2?'翌々月':'翌月'}${c.payDay==='end'?'末日':c.payDay+'日'}払い（土日祝は${c.holiday==='prev'?'前':c.holiday==='none'?'そのまま':'翌営業日'}）`;}
function everyLabel(r){
  if(r.every==='year')return `毎年${r.month}月${r.day==='end'?'末日':r.day+'日'}`;
  if(r.every==='nmonth'){const sd=pd(r.start);const ms=[];for(let i=0;i<12;i+=Math.max(1,Number(r.mInt)||2))ms.push(((sd.getMonth()+i)%12)+1);
    return `${r.mInt||2}か月ごと${r.day==='end'?'末日':r.day+'日'}（${ms.sort((a,b)=>a-b).join('・')}月）${r.adjust&&r.adjust!=='none'?`（土日祝は${r.adjust==='prev'?'前':'後'}）`:''}`;}
  if(r.every==='month')return `毎月${r.day==='end'?'末日':r.day+'日'}${r.adjust&&r.adjust!=='none'?`（土日祝は${r.adjust==='prev'?'前':'後'}）`:''}`;
  if(r.every==='week')return `毎週${WD[pd(r.start).getDay()]}曜`;if(r.every==='2week')return `2週ごと（${WD[pd(r.start).getDay()]}曜）`;return `${r.n}日ごと`;
}

let RS=null;
function restartBillRows(start){
  // スタート日より前（約2か月）の利用分が、スタート日以降に引き落とされる日をカードごとに洗い出す
  const rows=[];const s=pd(start);
  S.cards.forEach(c=>{const seen=new Set();
    for(let i=1;i<=75;i++){const d=ds(wdDate(c,addDays(s,-i),0));if(d>=start&&!seen.has(d)){seen.add(d);}}
    [...seen].sort().forEach(d=>{const ex=(S.startBills||[]).find(b=>b.cardId===c.id&&b.date===d);rows.push({id:ex?ex.id:uid(),cardId:c.id,date:d,amount:ex?ex.amount:''});});
  });
  // 既存の手入力で日付が外れたものも残す
  (S.startBills||[]).forEach(b=>{if(!rows.some(r=>r.id===b.id))rows.push(Object.assign({},b));});
  return rows.sort((a,b)=>cmp(a.date,b.date));
}
function openRestart(start){
  const t=new Date();
  if(!start)start=S.start||`${t.getFullYear()}-${pad(t.getMonth()+1)}-01`;
  const prev=RS;
  RS={start,bal:{},bills:restartBillRows(start),goals:{},del:prev?prev.del:true};
  S.accounts.forEach(a=>{RS.bal[a.id]=prev&&prev.bal[a.id]!=null?prev.bal[a.id]:(a.openingDate===start?a.opening:'');});
  (S.goals||[]).forEach(g=>{const st=goalStatus(g);RS.goals[g.id]=prev&&prev.goals[g.id]!=null?prev.goals[g.id]:st.remain;});
  if(prev)RS.bills.forEach(b=>{const o=prev.bills.find(x=>x.cardId===b.cardId&&x.date===b.date);if(o&&o.amount!=='')b.amount=o.amount;});
  renderRestart();
}
function renderRestart(){
  const before=S.tx.filter(x=>x.date<RS.start).length;
  sheet('🔄 仕切り直し',`<div class="fld"><label>スタート日</label><input type="date" value="${RS.start}" onchange="readRestart();openRestart(this.value)"></div>
    <div class="card"><h3>① スタート日の朝の残高（口座ごと）</h3>${S.accounts.map(a=>`<div class="row" style="margin:5px 0"><span class="sp">${a.type==='wallet'?'👛':'🏦'} ${esc(a.name)}</span><input type="number" inputmode="numeric" style="width:140px" data-rsbal="${a.id}" value="${RS.bal[a.id]}" placeholder="0"></div>`).join('')}
      <button class="btn sub sm" onclick="readRestart();closeSheet();editAcc()">＋ 口座を追加</button>
      <div class="note">通帳やアプリで、スタート日の朝（その日の出入りの前）の残高を入れてください。</div></div>
    <div class="card"><h3>② スタート前に使ったカードの請求額</h3>${RS.bills.length?RS.bills.map((b,i)=>{const c=cardById(b.cardId);return `<div class="row" style="margin:5px 0"><span class="cdot" style="width:6px;height:28px;border-radius:3px;flex:none;background:${c?cardColor(c):'#999'}"></span>
        <span class="sp" style="font-size:12.5px"><b>${esc(c?c.name:'?')}</b><br><span class="muted">${md(b.date)} 引き落とし</span></span><input type="number" inputmode="numeric" style="width:140px" data-rsbill="${i}" value="${b.amount}" placeholder="0"></div>`;}).join(''):'<div class="muted">カードが登録されていません</div>'}
      <div class="note">${md(RS.start)}より前に使った分の請求額（カード会社のアプリの確定・未確定の利用額）を、引き落とし日ごとに入れてください。${md(RS.start)}以降に使った分は、記録すれば自動で足されます。</div></div>
    ${(S.goals||[]).length?`<div class="card"><h3>③ 目標の残り（スタート日の時点）</h3>${S.goals.map(g=>`<div class="row" style="margin:5px 0"><span class="sp">${esc(g.icon||'🎯')} ${esc(g.name)}</span><input type="number" inputmode="numeric" style="width:140px" data-rsgoal="${g.id}" value="${RS.goals[g.id]}"></div>`).join('')}
      <div class="note">支払いはスタート日以降の分から並べ直します。</div></div>`:''}
    <label class="row" style="margin:8px 0;font-size:13px"><input type="checkbox" id="rsDel" style="width:auto" ${RS.del?'checked':''}> スタート日より前の記録を消す（${before}件）</label>
    <button class="btn" onclick="applyRestart()">この内容で仕切り直す</button>`);
}
function readRestart(){
  if(!RS)return;
  document.querySelectorAll('[data-rsbal]').forEach(i=>RS.bal[i.dataset.rsbal]=i.value);
  document.querySelectorAll('[data-rsbill]').forEach(i=>RS.bills[Number(i.dataset.rsbill)].amount=i.value);
  document.querySelectorAll('[data-rsgoal]').forEach(i=>RS.goals[i.dataset.rsgoal]=i.value);
  const d=document.getElementById('rsDel');if(d)RS.del=d.checked;
}
function applyRestart(){
  readRestart();const st=RS.start;if(!st){toast('スタート日を入れてください');return;}
  const nDel=RS.del?S.tx.filter(x=>x.date<st).length:0;
  if(!confirm(`${md(st)} から仕切り直します。${nDel?`\nスタート日より前の記録 ${nDel}件を消します（元に戻せません）。`:''}\nよろしいですか？`))return;
  S.start=st;
  S.accounts.forEach(a=>{a.openingDate=st;a.opening=Number(RS.bal[a.id])||0;});
  S.startBills=RS.bills.filter(b=>Number(b.amount)>0).map(b=>({id:b.id,cardId:b.cardId,date:b.date,amount:Number(b.amount)}));
  if(RS.del){S.tx=S.tx.filter(x=>x.date>=st);S.recurring.forEach(r=>{if(r.start<st)r.start=st;});}
  (S.goals||[]).forEach(g=>{const rem=Number(RS.goals[g.id]);if(!isNaN(rem)&&RS.goals[g.id]!==''){g.done=Math.max(0,(Number(g.total)||0)-rem);if(!g.start||g.start<st)g.start=st;Object.keys(g.ex||{}).forEach(d=>{if(d<st)delete g.ex[d];});}});
  unifyLegacyFixed();S.ui.setupDone=true;RS=null;save();closeSheet();goToday();toast('仕切り直しました');
}

function legacyPayDate(y,m0,st){

  const gl=goals.map(g=>{
    const total=Number(g.total)||Number(g.startRemaining)||0;
    const saved0=g.saved0!=null?Number(g.saved0)||0:(g.startRemaining!=null?Math.max(0,total-Number(g.startRemaining)):0);
    const sm=Number(g.startMonth)||0;
    const hist=(savedByGoal[g.id]||[]).filter(h=>!sm||Number(h.date.slice(0,4))*100+Number(h.date.slice(5,7))>=sm-1).sort((a,b)=>cmp(a.date,b.date));
    const before=hist.filter(h=>h.date<cut).reduce((s,h)=>s+h.v,0);
    const futureH=hist.filter(h=>h.date>=cut);
    // 支払いの開始は「今日以降で最初の給料日」（家計管理で積立額が空欄の月は毎月の額がそのまま入る扱い）
    const pdays=months.map(k=>{const [,y,mm]=k.match(/^kakeibo_(\d{4})_(\d{2})$/);return {kym:Number(y)*100+Number(mm),d:legacyPayDate(Number(y),Number(mm)-1,data[k])};});
    const firstP=pdays.find(x=>x.d>=cut&&(!sm||x.kym>=sm));
    const gStart=firstP?firstP.d:legacyPayDate(nx.getFullYear(),nx.getMonth(),lastSt);
    const ex={};futureH.forEach(h=>{if(h.v!==Number(g.monthly))ex[h.date]=h.v?{amount:h.v}:{skip:true};});
    const debt=g.type?g.type!=='saving':/返済|借金|ローン|奨学/.test(g.name||'');
    return {id:uid(),src:'legacy',lid:g.id,name:g.name||'目標',icon:debt?'💸':'🐷',kind:debt?'debt':'save',total,done:Math.min(total,saved0+before),
      monthly:Number(g.monthly)||0,day:pdBase,adjust:pdAdj,start:gStart,method:'a:'+bank,toAcc:'',ex};
  });
  return {tx,rec,months,pdBase,pdAdj,goals:gl};
}
function applyLegacy(data,label){
  let r;const backup=JSON.stringify(S);
  try{
    S.tx=S.tx.filter(t=>t.src!=='legacy');S.recurring=S.recurring.filter(x=>x.src!=='legacy');
    r=convertLegacy(data);if(S.start)r.tx=r.tx.filter(t=>t.date>=S.start);
  }catch(e){S=JSON.parse(backup);toast(e.message||'取り込めませんでした');return;}
  const ml=m=>m.replace(/^kakeibo_(\d{4})_(\d{2})$/,(_,y,mm)=>`${y}年${Number(mm)}月`);
  if(!confirm(`${label}\n\n${ml(r.months[0])}〜${ml(r.months[r.months.length-1])}（${r.months.length}か月分）\n記録 ${r.tx.length}件、固定費・定期収入 ${r.rec.length}件、目標 ${r.goals.length}件を取り込みます。${S.start?`\n（スタート日 ${md(S.start)} より前の記録は取り込みません）`:''}\n\n月のはじまりも家計管理に合わせて「${r.pdBase}日・土日は${r.pdAdj==='prev'?'前':'後'}の平日」にします。よろしいですか？`)){S=JSON.parse(backup);return;}
  S.tx.push(...r.tx);S.recurring.push(...r.rec);
  // 目標は家計管理の同じ目標を置き換え（自分で足した目標はそのまま）
  const oldG=S.goals.filter(g=>g.src==='legacy');
  r.goals.forEach(ng=>{const og=oldG.find(o=>o.lid===ng.lid)||S.goals.find(o=>o.src==='preset'&&o.name===ng.name);
    if(og){ng.method=goalMethod(og);ng.toAcc=og.toAcc;ng.icon=og.icon;ng.kind=og.kind;ng.replaces=og.replaces;ng.extra=og.extra;}});
  S.goals=S.goals.filter(g=>g.src!=='legacy'&&!(g.src==='preset'&&r.goals.some(n=>n.name===g.name))).concat(r.goals);
  dedupeGoalFixed();unifyLegacyFixed();
  // AI提案のクレジット記録を引き継ぐ（初回のみ）
  if(data.kakeibo_ai_usd&&!S.ai.usd.fromLegacy){const u=data.kakeibo_ai_usd;S.ai.usd={spent:Number(u.spent)||0,uses:u.uses||[],deposits:u.deposits||[],fromLegacy:true};}
  S.settings.startDay=r.pdBase;S.settings.shift=r.pdAdj;S.settings.nameBy='start';
  S.ui.setupDone=true;S.ui.importedAt=todayStr();save();goToday();
  toast('取り込みました');
  setTimeout(()=>alert('取り込みが終わりました。\n\n家計管理には「口座の今の残高」が無いため、⚙️設定 →「口座・財布」で今の残高（今日の日付）を入れてください。入れると「この先使える額」と引き落とし日の残高チェックが正しく出ます。'),300);
}
function importLegacyLocal(){applyLegacy(legacyCollectLocal(),'この端末の家計管理データ');}
function importLegacyPaste(){
  let d;try{d=JSON.parse(document.getElementById('lgPaste').value);}catch(e){toast('JSONとして読めませんでした');return;}
  if(d&&d.files&&d.files['kakeibo_data.json'])d=JSON.parse(d.files['kakeibo_data.json'].content);
  applyLegacy(d,'貼り付けたデータ');
}
async function importLegacyGist(){
  const id=(document.getElementById('lgGist').value||'').trim().replace(/^.*\//,'');if(!id){toast('Gist ID を入れてください');return;}
  const proxy=lsGet('gh_proxy').trim().replace(/\/+$/,'');const token=lsGet('gh_token');
  toast('読み込み中…');
  try{
    let res=await fetch(`https://api.github.com/gists/${id}`,{headers:token?{'Authorization':`Bearer ${token}`}:{}}).catch(()=>null);
    if((!res||!res.ok)&&proxy)res=await fetch(`${proxy}/gists/${id}`,{headers:token?{'Authorization':`Bearer ${token}`}:{}});
    if(!res||!res.ok)throw new Error('Gist を読み込めませんでした（IDを確認してください）');
    const j=await res.json();const f=j.files&&j.files['kakeibo_data.json'];if(!f)throw new Error('Gist に kakeibo_data.json がありません');
    let content=f.content;if(f.truncated&&f.raw_url)content=await (await fetch(f.raw_url)).text();
    applyLegacy(JSON.parse(content),'クラウド（Gist）のデータ');
  }catch(e){toast(e.message||'読み込めませんでした');}
}
function removeLegacy(){
  if(!confirm('家計管理から取り込んだ記録・固定費・目標をすべて消します（手入力した分は残ります）。よろしいですか？'))return;
  S.tx=S.tx.filter(t=>t.src!=='legacy');S.recurring=S.recurring.filter(x=>x.src!=='legacy');S.goals=S.goals.filter(g=>g.src!=='legacy');save();render();
}

// ── ☁️ GitHub Gist 同期（見通し家計簿専用の Gist。家計管理の Gist には書き込まない）──
// Token と中継URLは家計管理の設定（gh_token / gh_proxy）をそのまま使える。データ本体（S）には入れない
const SYNC_KEY='mitooshi_sync',GIST_FILE='mitooshi_data.json';
function syncCfg(){let c={};try{c=JSON.parse(localStorage.getItem(SYNC_KEY)||'{}')||{};}catch(e){}return Object.assign({gistId:'',token:'',proxy:'',auto:true,lastSync:'',remoteAt:'',localAt:''},c);}
function saveSyncCfg(c){try{localStorage.setItem(SYNC_KEY,JSON.stringify(c));}catch(e){}}
const syncToken=()=>syncCfg().token||lsGet('gh_token');
const syncBase=()=>{const p=(syncCfg().proxy||lsGet('gh_proxy')||'').trim().replace(/\/+$/,'');return p||'https://api.github.com';};
const syncReady=()=>!!syncToken();
let syncTimer=null,syncBusy=false,syncMsg='';
function syncErr(e){return e&&e.message==='Failed to fetch'?'GitHub に接続できませんでした（中継URLを確認してください）':(e&&e.message)||'不明なエラー';}
// 自動保存：変更のたびに少し待ってからアップロード（この端末を正とする）
function scheduleSync(){const c=syncCfg();c.localAt=new Date().toISOString();saveSyncCfg(c);if(!c.auto||!syncReady()||!c.gistId)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncTimer=null;syncUpload(true);},4000);}
async function syncUpload(silent){
  if(syncBusy)return;const token=syncToken();if(!token){if(!silent)toast('GitHub Token を入れてください');return;}
  const c=syncCfg();syncBusy=true;syncMsg='☁️ 保存中…';if(!silent)render();
  try{
    const url=c.gistId?`${syncBase()}/gists/${c.gistId}`:`${syncBase()}/gists`;
    const res=await fetch(url,{method:c.gistId?'PATCH':'POST',headers:{'Authorization':`Bearer ${token}`,'Content-Type':'application/json'},
      body:JSON.stringify({description:'見通し家計簿データ',public:false,files:{[GIST_FILE]:{content:JSON.stringify(Object.assign({savedAt:new Date().toISOString()},S))}}})});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||res.status);}
    const j=await res.json();const n=syncCfg();n.gistId=j.id;n.remoteAt=j.updated_at;n.lastSync=new Date().toISOString();saveSyncCfg(n);
    syncMsg=`✅ クラウドに保存しました（${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}）`;
  }catch(e){syncMsg='❌ 保存できませんでした：'+syncErr(e);if(!silent)toast('クラウドに保存できませんでした');}
  finally{syncBusy=false;if(tab==='set')render();}
}
async function syncFetch(){
  const c=syncCfg();const token=syncToken();if(!c.gistId)throw new Error('Gist ID がありません');
  const res=await fetch(`${syncBase()}/gists/${c.gistId}`,{headers:token?{'Authorization':`Bearer ${token}`}:{}});
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.message||res.status);}
  const j=await res.json();const f=j.files&&j.files[GIST_FILE];if(!f)throw new Error('この Gist に見通し家計簿のデータがありません');
  let content=f.content;if(f.truncated&&f.raw_url)content=await (await fetch(f.raw_url)).text();
  return {data:JSON.parse(content),updatedAt:j.updated_at};
}
function syncApply(r){
  if(!r.data||r.data.v!==1)throw new Error('データの形式が違います');
  delete r.data.savedAt;S=Object.assign(freshData(),r.data);S.ui=Object.assign({},freshData().ui,r.data.ui||{});migrateData();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  const c=syncCfg();c.remoteAt=r.updatedAt;c.lastSync=new Date().toISOString();c.localAt=c.lastSync;saveSyncCfg(c);
}
async function syncDownload(){
  if(!confirm('クラウドのデータでこの端末のデータを置き換えます。よろしいですか？'))return;
  syncMsg='☁️ 読み込み中…';render();
  try{syncApply(await syncFetch());syncMsg='✅ クラウドから読み込みました';goToday();toast('読み込みました');
  }catch(e){syncMsg='❌ 読み込めませんでした：'+syncErr(e);render();}
}
// 開いたとき・アプリに戻ったとき：クラウドの方が新しければ（他の端末で保存されていれば）自動で読み込む。
// この端末にもまだクラウドに上げていない変更があるときは、どちらを残すか聞く
async function syncCheckOnLoad(){
  const c=syncCfg();if(!c.gistId||!syncReady()||syncBusy||syncTimer)return;
  try{const token=syncToken();const res=await fetch(`${syncBase()}/gists/${c.gistId}`,{headers:{'Authorization':`Bearer ${token}`}});if(!res.ok)return;
    const j=await res.json();const n=syncCfg();if(!n.remoteAt||!(j.updated_at>n.remoteAt)||syncBusy||syncTimer)return;
    // 入力中（シートが開いている）なら書きかけを消さないよう、読み込まずに知らせるだけ
    if(document.getElementById('sheet').style.display==='flex'){syncMsg='🔔 クラウドに新しいデータがあります。「クラウドから読込」で最新にできます';toast('クラウドに新しいデータがあります（閉じてから戻ると読み込みます）');return;}
    const dirty=n.localAt&&n.lastSync&&n.localAt>n.lastSync;
    if(dirty&&!confirm('ほかの端末でクラウドに新しいデータが保存されています。\nこの端末にもまだクラウドに保存していない変更があります。\n\nOK：クラウドの最新を読み込む（この端末の変更は消えます）\nキャンセル：この端末のデータを残す'))
      {syncMsg='🔔 クラウドに新しいデータがあります。「クラウドから読込」で最新にできます';if(tab==='set')render();return;}
    syncApply(await syncFetch());syncMsg='✅ クラウドの最新を自動で読み込みました';
    applyHide();goToday();toast('最新のデータを読み込みました');
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncCheckOnLoad();});
function renderSync(){
  const c=syncCfg();const tk=syncToken();
  return `<div class="card" id="syncCard"><h3>☁️ クラウド同期</h3>
    <div class="fld"><label>GitHub Token</label><input type="password" id="syTok" value="${esc(c.token)}" placeholder="${lsGet('gh_token')?'家計管理と同じ':'ghp_…'}"></div>
    <div class="fld"><label>中継URL（任意）</label><input id="syProxy" value="${esc(c.proxy)}" placeholder="${esc(lsGet('gh_proxy')||'未入力なら api.github.com に直接')}"></div>
    <div class="fld"><label>Gist ID</label><input id="syGist" value="${esc(c.gistId)}" placeholder="空なら自動で作成"></div>
    <label class="row" style="font-size:13px;margin:6px 0"><input type="checkbox" id="syAuto" style="width:auto" ${c.auto?'checked':''}> 自動で保存</label>
    <button class="btn sub sm" onclick="saveSyncForm()">設定を保存</button>
    <div class="grid2" style="margin-top:8px"><button class="btn" onclick="saveSyncForm(true);syncUpload(false)" ${tk?'':'disabled'}>クラウドに保存</button><button class="btn sub" onclick="saveSyncForm(true);syncDownload()">クラウドから読込</button></div>
    <div class="muted" style="margin-top:6px">${esc(syncMsg)||(c.lastSync?`最終同期 ${new Date(c.lastSync).toLocaleString('ja-JP')}`:'未同期')}</div></div>`;
}
function saveSyncForm(quiet){
  const v=id=>(document.getElementById(id)||{}).value||'';const c=syncCfg();
  c.token=v('syTok').trim();c.proxy=v('syProxy').trim();const g=v('syGist').trim().replace(/^.*\//,'');
  if(g!==c.gistId){c.gistId=g;c.remoteAt='';}
  c.auto=!!(document.getElementById('syAuto')||{}).checked;saveSyncCfg(c);if(!quiet){toast('同期の設定を保存しました');render();}
}

// ── バックアップ ──
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function exportJSON(){download(`mitooshi-backup-${todayStr()}.json`,JSON.stringify(S,null,1),'application/json');}
function exportCSV(){
  const q=s=>`"${String(s==null?'':s).replace(/"/g,'""')}"`;
  const rows=[['日付','種類','金額','カテゴリ','支払い方法/口座','回数','メモ']];
  S.tx.slice().sort((a,b)=>cmp(a.date,b.date)).forEach(t=>rows.push([t.date,{out:'支出',in:'収入',move:'振替'}[t.type],t.amount,t.type==='move'?'':catById(t.cat).name,
    t.type==='move'?`${(accById(t.from)||{}).name}→${(accById(t.to)||{}).name}`:mName(t.method).replace(/^\S+ /,''),t.count||1,t.memo]));
  download(`mitooshi-${todayStr()}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d||d.v!==1||!Array.isArray(d.tx))throw 0;
    if(!confirm(`記録${d.tx.length}件のバックアップで今のデータを置き換えます。よろしいですか？`))return;
    S=Object.assign(freshData(),d);save();goToday();toast('戻しました');}catch(e){toast('読み込めないファイルです');}finally{inp.value='';}};
  rd.readAsText(f);
}
function resetAll(){if(!confirm('見通し家計簿のデータをすべて消します（家計管理のデータは消えません）。よろしいですか？'))return;localStorage.removeItem(KEY);load();goToday();}

load();if(S.ui.fcH)fcH=S.ui.fcH;presetGoals();save.quiet=true;save();save.quiet=false;applyHide();goToday();syncCheckOnLoad();
</script>
